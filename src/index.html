<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Greener, but not cleaner? The global electricity transition</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
</head>
<body>
  <header>
    <h1>Greener, but not cleaner?</h1>
    <p class="subtitle">The global electricity transition, 1985–2025</p>
  </header>

  <nav id="global-filters" aria-label="Filters"></nav>

  <main>
    <nav class="breadcrumb" aria-label="Level"><span aria-current="page">World</span></nav>

    <section id="view-world" class="view-world">
      <figure class="panel panel-map">
        <figcaption>
          <h2 id="map-title"></h2>
          <p class="how-to-read" id="map-how-to-read"></p>
        </figcaption>
        <div class="chart" id="chart-map"></div>
      </figure>
    </section>
  </main>

  <footer>
    <p>Data: <a href="https://github.com/owid/energy-data" target="_blank" rel="noopener">Our World in Data — Energy</a>,
      compiled from Ember and the Energy Institute (CC BY 4.0).
      Built with <a href="https://d3js.org/" target="_blank" rel="noopener">D3.js</a>.</p>
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
