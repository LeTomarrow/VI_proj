<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Greener, but not cleaner? The global electricity transition</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
</head>
<body>
  <header>
    <h1>Greener, but not cleaner?</h1>
    <p class="subtitle">The global electricity transition, 1985–2025</p>
  </header>

  <nav id="global-filters" aria-label="Filters"></nav>

  <main>
    <nav id="navigation" class="navigation" aria-label="Level and comparison"></nav>

    <!-- Views A (World) and B (Continent) share the map and the Marimekko; only the third
         panel changes with the level. -->
    <section class="views">
      <figure class="panel panel-map">
        <figcaption>
          <h2 id="map-title"></h2>
          <p class="how-to-read" id="map-how-to-read"></p>
        </figcaption>
        <div class="chart" id="chart-map"></div>
      </figure>

      <figure class="panel panel-marimekko">
        <figcaption>
          <h2 id="marimekko-title"></h2>
          <p class="how-to-read">Width = total generation, height = share of each source. Top strip = map colour.</p>
        </figcaption>
        <div class="chart" id="chart-marimekko"></div>
      </figure>

      <figure class="panel panel-wide" id="panel-emissions">
        <figcaption>
          <h2 id="emissions-title"></h2>
          <p class="how-to-read" id="emissions-how-to-read"></p>
        </figcaption>
        <div class="chart" id="chart-emissions"></div>
      </figure>

      <!-- View B (M3): the continent's countries. The radar tab stays here until View C (M4) exists. -->
      <figure class="panel panel-wide" id="panel-continent" hidden>
        <figcaption>
          <div class="compare-heading">
            <h2 id="continent-title"></h2>
            <div class="segmented compare-tabs" role="tablist" aria-label="Country charts">
              <button type="button" id="tab-scatter" role="tab" aria-selected="true" aria-controls="compare-scatter" tabindex="0">Scatter</button>
              <button type="button" id="tab-profiles" role="tab" aria-selected="false" aria-controls="compare-profiles" tabindex="-1">Country profiles</button>
            </div>
          </div>
        </figcaption>
        <div class="tab-panel" id="compare-scatter" role="tabpanel" aria-labelledby="tab-scatter" tabindex="0">
          <p class="how-to-read">Compare countries using the bubble scatter. This chart is being built.</p>
        </div>
        <div class="tab-panel" id="compare-profiles" role="tabpanel" aria-labelledby="tab-profiles" tabindex="0" hidden>
          <h3 class="tab-title" id="profiles-title"></h3>
          <p class="how-to-read" id="profiles-description"></p>
          <div class="chart" id="chart-profiles"></div>
        </div>
      </figure>
    </section>
  </main>

  <footer>
    <p>Data: <a href="https://github.com/owid/energy-data" target="_blank" rel="noopener">Our World in Data</a>
      (Ember, Energy Institute), CC BY 4.0 · Built with <a href="https://d3js.org/" target="_blank" rel="noopener">D3.js</a></p>
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
