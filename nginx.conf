server {
    listen 8080;
    root /usr/share/nginx/html;
    # Relative redirects: the container port (8080) differs from the host port (8000).
    absolute_redirect off;

    location = / {
        return 302 /src/;
    }

    location / {
        # Always serve the latest data and code during development.
        add_header Cache-Control "no-cache";
    }
}
